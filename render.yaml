services:
  # 1. Backend Web Service (Node.js Express Server)
  - type: web
    name: worthwise-api
    env: node
    plan: free
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: PORT
        value: "5000"
      - key: SUPABASE_URL
        value: https://yoghqhcaesogkvorfnei.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

  # 2. Frontend Static Site (React Single Page App)
  - type: web
    name: worthwise-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_SUPABASE_URL
        value: https://yoghqhcaesogkvorfnei.supabase.co
      - key: REACT_APP_SUPABASE_ANON_KEY
        sync: false
      - key: REACT_APP_API_BASE
        value: https://worthwise-api.onrender.com/api
